services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: voxel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: voxel_world
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - voxel-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxel -d voxel_world"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  voxel-postgres:
